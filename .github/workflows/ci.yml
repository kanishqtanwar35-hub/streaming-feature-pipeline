name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # The claim this job proves: the windowing logic needs no infrastructure.
  # A pipeline whose windows can only be exercised by standing up a broker is
  # one whose windows do not get exercised.
  # ---------------------------------------------------------------------------
  core:
    name: no broker, no JVM (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install nothing but pytest
        run: python -m pip install --upgrade pip pytest

      - name: Tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Skew under a SHORT watermark, where mismatch is the documented cost
        env:
          PYTHONPATH: src
        run: python -m featurepipe.cli parity

      - name: Exactness under a COVERING watermark, where mismatch is a bug
        env:
          PYTHONPATH: src
        # This is the one that can fail. With the watermark above the feed's
        # maximum lateness both paths had the same information, so the two
        # implementations must agree exactly - a mismatch here is a real bug,
        # not a trade-off, and the command exits non-zero.
        run: python -m featurepipe.cli --max-lateness 90 --watermark 95 parity

      - name: The watermark trade-off, as a table
        env:
          PYTHONPATH: src
        run: python -m featurepipe.cli sweep

      - name: The parity law, demonstrated
        env:
          PYTHONPATH: src
        run: python -m featurepipe.cli boundary

  # ---------------------------------------------------------------------------
  # The third implementation. Runs NATIVELY here - the Ubuntu runners ship a
  # JDK - which is why a Windows developer needs Docker and CI does not.
  # ---------------------------------------------------------------------------
  spark:
    name: spark agrees with pure python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Java is preinstalled on the runner
        run: java -version

      - run: pip install pyspark

      - name: A different execution model, the same numbers
        env:
          PYTHONPATH: src
        # Exits non-zero if Spark and the pure-Python reference disagree.
        # Two implementations by one author might be wrong the same way; a
        # distributed query planner is an independent reading of the spec.
        run: python src/featurepipe/spark_batch.py

  # ---------------------------------------------------------------------------
  # The transport. A real broker, because the bugs this found - async topic
  # creation and unchecked send futures - are invisible without one.
  # ---------------------------------------------------------------------------
  kafka:
    name: kafka round trip
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pytest kafka-python-ng

      - name: Wait for the broker
        run: |
          for i in $(seq 1 30); do
            if python - <<'PY'
          import sys
          from kafka.admin import KafkaAdminClient
          try:
              KafkaAdminClient(bootstrap_servers="localhost:9092",
                               request_timeout_ms=2000).close()
          except Exception:
              sys.exit(1)
          PY
            then echo "broker ready"; exit 0; fi
            sleep 2
          done
          echo "broker never came up"; exit 1

      - name: Integration tests
        env:
          PYTHONPATH: src
        # Includes the no-loss test. `producer.send()` is fire-and-forget and
        # `retries` defaults to 0, so this is the job that catches records
        # being dropped between the producer and the broker.
        run: pytest -q tests/test_kafka.py

      - name: A full round trip through the broker
        env:
          PYTHONPATH: src
        run: python -m featurepipe.cli --minutes 30 --symbols 3 kafka
