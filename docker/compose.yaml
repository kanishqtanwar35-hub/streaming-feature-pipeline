# A local Kafka. KRaft mode - no ZooKeeper, one container, ~285 MB of RAM.
#
#   docker compose -f docker/compose.yaml up -d
#   docker compose -f docker/compose.yaml down -v
#
# Free, and nothing here reaches the internet after the image is pulled.
services:
  kafka:
    image: apache/kafka:latest
    container_name: featurepipe-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # One process is both broker and controller. Fine for a single node and
      # explicitly NOT how you would run this in production - it is the
      # deployment topology that makes a laptop demo free.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Replication factor 1 because there is one broker. Anything higher and
      # every internal topic stays under-replicated forever, and the broker
      # logs about it until you notice.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
